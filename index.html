<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width", initial-scale="1.0">
<title>siema</title>
<style>
  .card img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .container{
    display: flex;
    align-items: center;
    flex-direction: column;
    font-size: large;
    justify-content: center;
  
    
    
  }

    body{
        background: #ced7ea;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }
    .deck{
        position: relative;
        cursor: pointer;
        height: 220px;
        width: 150px;

    } 
     
    .card{
        position: absolute;
        background: #030508;
        color: #ced7ea;
        height: 100%;
        width: 100%;
        border-radius: 20px;
        border: 2px solid rgba (255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font: sans-serif;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.6s cubic-bezier(0.75, -0.5, 0.27, 1.55);
        transform-origin: center; 
        overflow: hidden;
        
        }
        
                .deck:hover .c1{
                transform: translate(-155px,
                -10px);
                }
                  .deck:hover .c2{
                transform: translate(-310px,
                -10px);
                }
                  .deck:hover .c3{
                transform:  translate(0px,
                -10px);
                }
                  .deck:hover .c4{
                transform:translate(155px,
                -10px);
                }
                  .deck:hover .c5{
                transform:translate(310px,
                -10px);
                }

                .card:hover{
                  background: #12151a !important;
                  color: white !important;
                  z-index: 10 !important;
                }
        
</style>
</head>
<body>
  <div class="container">
    <h1>Moja strona</h1>
    <p>moja prosta strona o kartach</p>
    
    <div class="deck">
      <div class="card c1" style="z-index: 1;"><img src="karta 1.png"></div>
      <div class="card c2" style="z-index: 2;"><img src="karta 2.jpg"></div>
      <div class="card c3" style="z-index: 3;"><img src="karta 3.jpg"></div>
      <div class="card c4" style="z-index: 2;"><img src="karta 4.png"></div>
      <div class="card c5" style="z-index: 1;"><img src="karta 5.webp"></div>
      
      
    </div>
  </div>
 
    
</body>
</html>
